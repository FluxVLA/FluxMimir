[metadata]
name = fluxmimir
version = attr: fluxmimir.version.__version__
description = Data conversion, visual processing, and automated annotation for the Flux ecosystem
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
classifiers =
    Development Status :: 2 - Pre-Alpha
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.10,<3.13
include_package_data = True
install_requires =
    mmengine==0.10.7
    numpy==1.26.4

[options.extras_require]
conversion =
    h5py>=3.10,<4
    pyarrow>=15
    av>=14,<17
    opencv-python-headless>=4.10,<5
    tqdm>=4.66,<5
vision =
    opencv-python-headless>=4.10,<5
    Pillow>=10,<13
api =
    httpx>=0.27,<1
dev =
    codespell==2.2.1
    flake8==7.3.0
    isort==5.11.5
    pre-commit==4.5.1
    pytest>=7.4,<8
    yapf==0.43.0

[options.entry_points]
console_scripts =
    fluxmimir-convert = fluxmimir.cli.convert:main
    fluxmimir-synthesize = fluxmimir.cli.synthesize:main
    fluxmimir-annotate = fluxmimir.cli.annotate:main
    fluxmimir-validate = fluxmimir.cli.validate:main

[options.packages.find]
exclude =
    test
    test.*

[aliases]
test = pytest

[tool:pytest]
testpaths = test
addopts = -ra

[flake8]
max-line-length = 79
extend-ignore = E203,W503

[yapf]
based_on_style = pep8
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 79
multi_line_output = 0
known_first_party = fluxmimir
default_section = THIRDPARTY

[codespell]
quiet-level = 3
ignore-words-list = mimir
